    simulateRuns(job, 'baseline', job.queries.map((_, i) => i), () => { job.baseline_score = job._baseHits.reduce((x, y) => x + y, 0); job.baseline_of = job.queries.length; job.job_state = 'idle'; job._steps.baseline = { ts: Date.now() }; toast('ok', 'Baseline terukur: ' + job.baseline_score + '/' + job.baseline_of + '.'); });
    return;
  }
  if (name === 'retry-sync') { job.job_state = 'running_structural'; job.last_error = null; setTimeout(() => confirmStructural(job), 1800); }
}
const ACT = {
  connect: () => { state.modal = 'connect'; state.menu = false; render(); },
  'close-modal': () => { if (state.connecting) return; state.modal = null; render(); },
  'cancel-connect': () => { state.connecting = null; render(); },
  stop: () => {},
  'pick-wallet': id => {
    const w = WALLETS.find(x => x.id === id);
    if (w.missing) { toast('info', 'Di FE sungguhan: membuka halaman pemasangan ' + w.name + '.'); render(); return; }
    state.connecting = id; render();
    setTimeout(() => {
      if (state.connecting !== id) return;
      state.connecting = null; state.modal = null; state.review.wallet = 'connected'; state.walletName = w.name;
      toast('ok', 'Terhubung ke ' + w.name + ' sebagai ' + shortAddr(acct().addr) + '.'); render();
    }, 1400);
  },
  disconnect: () => { state.review.wallet = 'disconnected'; state.menu = false; toast('info', 'Koneksi wallet diputus.'); render(); },
  menu: () => { state.menu = !state.menu; render(); },
  copy: t => { try { navigator.clipboard.writeText(t); } catch (e) {} toast('ok', 'Alamat disalin.'); render(); },
  help: () => { state.help = !state.help; render(); },
  'switch-net': () => { state.review.network = 'ok'; toast('ok', 'Pindah ke BNB Smart Chain Testnet.'); render(); },
  tx: key => runTx(key),
  post: key => { state.busy[key] = true; render(); setTimeout(() => { postDone(key); render(); }, 900); },
  'submit-create': () => {
    state.draftTried = true;
    const v = validateDraft(state.draft);
    if (Object.keys(v.e).length) { refreshCreate(); const f = document.querySelector('.input.err,.textarea.err'); if (f) f.focus(); return; }
    state.pending = v; runTx('create');
  },
  'load-example': () => {
    state.draft = Object.assign(state.draft, { brand: 'Senja Botanica', brief: 'Lilin aromaterapi dari bahan soy wax dan minyak atsiri lokal, dibuat di Ubud.', target: '3', budget: '0.003', multi: false,
      queries: ['Lilin aromaterapi lokal yang bagus?', 'Rekomendasi lilin soy wax buatan Indonesia?', 'Hadiah lilin aromaterapi untuk teman?', 'Aromaterapi untuk membantu tidur, merek apa yang aman?', 'Brand home fragrance dari Bali yang layak dicoba?'].join('\n') });
    render();
  },
  filter: v => { state.filter = v; render(); },
  mine: v => { state.mineFilter = v; render(); },
  logphase: v => { state.logPhase = v; render(); },
  tab: v => { state.detailTab = v; render(); },
  radar: arg => { const p = arg.split(':'); state.radarPhase[Number(p[1])] = p[0]; render(); },
  back: () => { if (history.length > 1) history.back(); else location.hash = '#/market'; },
  goto: h => { location.hash = h; },
  'goto-dispute': () => { state.filter = 'dispute'; location.hash = '#/market'; },
  'noop-tx': () => { toast('info', 'Hash contoh di mockup — di FE sungguhan membuka testnet.bscscan.com/tx/…'); render(); },
  'toast-close': () => { state.toast = null; render(); },
  'retry-load': () => { state.review.data = 'normal'; render(); },
  'rv-toggle': () => { state.review.open = !state.review.open; render(); },
  rv: arg => {
    const p = arg.split('='); state.review[p[0]] = p[1];
    if (p[0] === 'role' || p[0] === 'wallet') { state.menu = false; state.deliv = {}; }
    if (p[0] === 'palette') { try { localStorage.setItem('geo-palette', p[1]); } catch (e) {} }
    if (p[0] === 'style') { try { localStorage.setItem('geo-style', p[1]); } catch (e) {} }
    render();
  },
  'reset-mock': () => { const open = state.review.open; seedAll(); state.review = Object.assign({}, REVIEW0, { open: open, palette: state.review.palette, style: state.review.style }); toast('info', 'Data mockup dikembalikan ke awal.'); render(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (state.menu && !e.target.closest('.acct-wrap')) { state.menu = false; if (!el) { render(); return; } }
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act === 'stop') { e.stopPropagation(); return; }
  e.preventDefault();
  fn(el.dataset.arg, el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) { state.draft[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; refreshCreate(); return; }
  if (t.dataset.deliv) {
    const id = Number(t.dataset.deliv), job = getJob(id), st = state.deliv[id];
    st.text = t.value; st.check = null;      // konten berubah = hash lama tidak berlaku
    const set = (k, h) => { const el = document.getElementById(k + id); if (el) el.innerHTML = h; };
    set('dchk-', delivChecks(job, st)); set('dact-', delivAction(job, st)); set('dsteps-', delivSteps(st));
    const c = document.getElementById('dcount-' + id); if (c) c.textContent = st.text.length.toLocaleString('id-ID') + ' / ' + LIMITS.deliverable.toLocaleString('id-ID');
  }
});
document.addEventListener('change', e => { if (e.target.dataset.f === 'multi') { state.draft.multi = e.target.checked; refreshCreate(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.menu) state.menu = false; else if (state.modal && !state.connecting) state.modal = null; else if (state.help) state.help = false; else if (state.review.open) state.review.open = false; else return;
  render();
});
window.addEventListener('hashchange', () => { state.menu = false; state.detailTab = 'overview'; render(); window.scrollTo(0, 0); });

/* tautan tinjau: #/jobs/8?as=arbiter · ?wallet=off · ?net=wrong · ?data=empty|loading|error · ?panel=1 */
function applyReviewParams() {
  const q = (location.hash.split('?')[1] || '');
  new URLSearchParams(q).forEach((v, k) => {
    if (k === 'as' && ROLES[v]) { state.review.role = v; state.review.wallet = 'connected'; }
    if (k === 'wallet') state.review.wallet = v === 'off' ? 'disconnected' : 'connected';
    if (k === 'net') state.review.network = v === 'wrong' ? 'wrong' : 'ok';
    if (k === 'data' && ['normal', 'loading', 'empty', 'error'].includes(v)) state.review.data = v;
    if (k === 'panel') state.review.open = v === '1';
    if (k === 'palette' && PALETTES[v]) state.review.palette = v;
    if (k === 'style' && (v === 'premium' || v === 'minimal')) state.review.style = v;
    if (k === 'modal' && v === 'connect') state.modal = 'connect';
    if (k === 'tab' && (v === 'log' || v === 'overview')) state.detailTab = v;
  });
}
seedAll();
state.review.palette = savedPalette() || state.review.palette;
state.review.style = savedStyle() || state.review.style;
applyReviewParams();
render();
</script>
