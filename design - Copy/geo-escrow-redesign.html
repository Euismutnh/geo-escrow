<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEO Escrow — Mockup Redesign · Fase 1</title>
<!-- Di Fase 2 font ini pindah ke next/font/google (self-host). <link> hanya untuk mockup. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   GEO Escrow — mockup redesign Fase 1 · arah: editorial / fintech bersih
   ---------------------------------------------------------------------
   Token di :root adalah KONTRAK untuk Fase 2. Angka-angka ini dipindah
   apa adanya ke @theme di app/globals.css — bukan ditafsir ulang.
   Nama kelas badge (st-mint, st-violet, ...) sengaja sama dengan
   UI_STATUS_META.cls di lib/status.ts supaya FE memetakannya langsung.
   ===================================================================== */
:root{
  /* netral */
  --paper:#F8F8F6; --card:#FFFFFF; --sunken:#F3F4F2; --hover:#F1F2EF; --active:#EBEDEA;
  --ink:#16181D; --ink-2:#30343B; --muted:#4F565F; --faint:#6B727B;   /* kontras di kanvas: 17 · 7,0 · 4,6 — semua lolos AA */
  --line:#E4E7EA; --line-2:#D5D9DE; --line-3:#C3C8CF;
  /* tujuh peran warna — hue prototipe, porsi diturunkan jadi aksen */
  --chain:#2947C4;  --chain-hi:#2140B0;  --chain-soft:#EEF1FC;  --chain-line:#C9D3F5;
  --verify:#1B6B36; --verify-hi:#155A2C; --verify-soft:#ECF6EF; --verify-line:#C2E0CE;
  --signal:#B5590C;                      --signal-soft:#FDF3E7; --signal-line:#F0D5B4;
  --warn:#8A6A05;                        --warn-soft:#FCF7E6;   --warn-line:#EBDCA8;
  --danger:#A5262F; --danger-hi:#8E1F28; --danger-soft:#FCEEEF; --danger-line:#F0C9CC;
  /* bentuk */
  --r:10px; --r-sm:7px; --r-lg:14px;
  --sh-1:0 1px 2px rgba(22,24,29,.05);
  --sh-2:0 1px 2px rgba(22,24,29,.04),0 8px 20px -8px rgba(22,24,29,.12);
  --sh-pop:0 20px 48px -16px rgba(22,24,29,.30),0 2px 8px rgba(22,24,29,.06);
  --ring-c:rgba(41,71,196,.22); --ring:0 0 0 3px var(--ring-c);
  /* peran MEREK — satu-satunya yang berganti antar palet.
     --chain di atas tetap untuk STATUS (st-violet, note-info): biru, bukan ungu. */
  --primary:#2947C4; --primary-hi:#2140B0; --on-primary:#FFFFFF;
  --accent:#2947C4; --accent-soft:#EEF1FC; --accent-line:#C9D3F5; --accent-ink:#2947C4;
  --mark:#16181D; --mark-dot:#5BC37F;
  /* huruf */
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  /* tata letak */
  --side:248px; --top:56px;
}

/* =========================== usulan palet =========================== */
:root[data-palette="samudra"]{
  --paper:#F6F8F7; --hover:#EEF3F2; --sunken:#F1F4F3;
  --primary:#0E6B73; --primary-hi:#0A565D; --ring-c:rgba(14,107,115,.24);
  --accent:#0E7C85; --accent-soft:#E5F2F2; --accent-line:#BCDCDD; --accent-ink:#0A5A61;
  --mark:#0D4A50; --mark-dot:#7DD8CF;
  --chain:#2459B3; --chain-hi:#1D4C9C; --chain-soft:#EDF3FC; --chain-line:#C7D8F2;
}
:root[data-palette="laut"]{
  --paper:#F7F8FA; --hover:#F0F2F5; --sunken:#F2F4F7;
  --primary:#1766C2; --primary-hi:#1256A8; --ring-c:rgba(23,102,194,.24);
  --accent:#1766C2; --accent-soft:#EAF2FC; --accent-line:#C4D9F3; --accent-ink:#11549F;
  --mark:#0F2F57; --mark-dot:#7FB6F5;
  --chain:#1766C2; --chain-hi:#1256A8; --chain-soft:#EAF2FC; --chain-line:#C4D9F3;
}
:root[data-palette="emas"]{
  --paper:#F9F8F5; --hover:#F2F1EC; --sunken:#F4F3EF;
  --primary:#1A1C21; --primary-hi:#34373E; --ring-c:rgba(184,135,11,.32);
  --accent:#B8870B; --accent-soft:#FAF3DE; --accent-line:#EAD9A4; --accent-ink:#725303;
  --mark:#1A1C21; --mark-dot:#E8B923;
  --chain:#2459B3; --chain-hi:#1D4C9C; --chain-soft:#EDF3FC; --chain-line:#C7D8F2;
}
:root[data-palette="terakota"]{
  --paper:#FAF8F5; --hover:#F4F1EC; --sunken:#F5F2EE;
  --primary:#B0442A; --primary-hi:#963822; --ring-c:rgba(176,68,42,.24);
  --accent:#B0442A; --accent-soft:#FBEEE9; --accent-line:#EFCABE; --accent-ink:#8C3520;
  --mark:#5A2415; --mark-dot:#F2A07F;
  --chain:#2459B3; --chain-hi:#1D4C9C; --chain-soft:#EDF3FC; --chain-line:#C7D8F2;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:'cv11','ss01'}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.011em;color:var(--ink)}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
ol,ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
::selection{background:var(--accent-line);color:var(--ink)}
.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:15px;height:15px}
.i-xs{width:13px;height:13px}
.mono{font-family:var(--mono);font-feature-settings:normal;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}
.u{color:var(--faint);font-weight:400;margin-left:.28em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lnk{color:var(--accent-ink);font-weight:500}
.lnk:hover{text-decoration:underline;text-underline-offset:2px}
.show-sm{display:none}

/* ============================ shell ============================ */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);padding:14px 12px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{display:block;flex-shrink:0}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-.02em;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--faint);line-height:1.3}
.nav-group+.nav-group{margin-top:10px}
.nav-label{font-size:11px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;padding:10px 10px 6px}
.nav-link{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;font-size:13.5px;transition:background .12s,color .12s}
.nav-link .i{color:var(--faint);transition:color .12s}
.nav-link:hover{background:var(--hover);color:var(--ink)}
.nav-link:hover .i{color:var(--muted)}
.nav-link.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-link.on .i{color:var(--accent)}
.nl-short{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:14px}
.wmini{border-radius:var(--r);padding:12px;background:var(--sunken)}
.wmini-top{display:flex;align-items:center;gap:10px}
.wmini-prov{font-size:11.5px;color:var(--faint);line-height:1.3}
.wmini-addr{font-size:12.5px;line-height:1.35}
.wmini-bal{font-size:15px;font-weight:600;margin-top:10px;letter-spacing:-.01em}
.wmini-bal small{font-size:12px;color:var(--muted);font-weight:500}
.wmini p{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.side-meta{display:flex;flex-direction:column;gap:2px;padding:0 10px 2px;font-size:11.5px;color:var(--faint)}
.side-meta a{display:inline-flex;align-items:center;gap:4px}
.side-meta a:hover{color:var(--ink)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 28px;background:rgba(248,248,246,.86);-webkit-backdrop-filter:saturate(180%) blur(10px);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.top-brand{display:none}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);min-width:0}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--line-3)}
.crumbs .cur{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.net{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.net-dot{width:7px;height:7px;border-radius:50%;background:#2E9E57;box-shadow:0 0 0 3px rgba(46,158,87,.15)}
.net.bad{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.net.bad .net-dot{background:var(--warn);box-shadow:0 0 0 3px rgba(138,106,5,.15)}
.acct-wrap{position:relative}
.acct{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 6px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);box-shadow:var(--sh-1);font-size:13px;transition:background .12s}
.acct:hover{background:var(--hover)}
.acct .i{color:var(--faint)}
.av{display:inline-block;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(22,24,29,.08)}
.content{width:100%;max-width:1180px;margin:0 auto;padding:28px 28px 72px}

/* ============================ tipografi halaman ============================ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:26px;line-height:1.2;letter-spacing:-.028em}
.page-sub{color:var(--muted);margin-top:6px;max-width:64ch}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);margin-bottom:6px}
.eyebrow .dotsep{width:3px;height:3px;border-radius:50%;background:var(--line-3)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 14px}
.sec-head h2{font-size:15px;letter-spacing:-.012em}
.sec-head a{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.sec-head a:hover{color:var(--ink)}

/* ============================ tombol ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid transparent;font-size:13.5px;font-weight:500;line-height:1;white-space:nowrap;user-select:none;transition:background .14s,border-color .14s,box-shadow .14s,color .14s}
.btn .i{width:16px;height:16px}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 1px 2px rgba(22,24,29,.22),inset 0 1px 0 rgba(255,255,255,.10)}
.btn-primary:hover{background:var(--primary-hi)}
.btn-secondary{background:var(--card);border-color:var(--line-2);color:var(--ink);box-shadow:var(--sh-1)}
.btn-secondary:hover{background:var(--hover);border-color:var(--line-3)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:var(--hover);color:var(--ink)}
.btn-success{background:var(--verify);color:#fff;box-shadow:0 1px 2px rgba(27,107,54,.25)}
.btn-success:hover{background:var(--verify-hi)}
.btn-danger{background:var(--card);border-color:var(--danger-line);color:var(--danger);box-shadow:var(--sh-1)}
.btn-danger:hover{background:var(--danger-soft);border-color:#E5AEB3}
.btn-net{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.btn-net:hover{background:#F8EFD0}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;gap:6px}
.btn-sm .i{width:14px;height:14px}
.btn-lg{height:42px;padding:0 18px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.busy{opacity:1;cursor:progress}
.btn-primary.busy{opacity:.78}
.btn-success.busy{background:#4D8B61}
.btn-secondary.busy,.btn-danger.busy{background:var(--sunken);color:var(--muted);border-color:var(--line-2)}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--r-sm);color:var(--muted);transition:background .12s,color .12s}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.copy{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;color:var(--faint);vertical-align:middle}
.copy:hover{background:var(--hover);color:var(--ink)}
.copy .i{width:13px;height:13px}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.75px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================ badge & tag ============================ */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 7px;border-radius:999px;border:1px solid;font-size:12px;font-weight:500;line-height:1;white-space:nowrap}
.badge .i{width:12px;height:12px;stroke-width:2.4}
.badge .spin{width:10px;height:10px;border-width:1.5px}
.badge-lg{height:28px;padding:0 11px 0 9px;font-size:13px;gap:7px}
.badge-lg .i{width:13px;height:13px}
.st-mint{background:var(--verify-soft);color:var(--verify);border-color:var(--verify-line)}
.st-violet{background:var(--chain-soft);color:var(--chain);border-color:var(--chain-line)}
.st-amber{background:var(--signal-soft);color:var(--signal);border-color:var(--signal-line)}
.st-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.st-rose{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.st-neutral{background:var(--sunken);color:var(--muted);border-color:var(--line)}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;background:var(--sunken);border:1px solid var(--line);font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.tag-chain{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.tag-verify{background:var(--verify-soft);border-color:var(--verify-line);color:var(--verify)}

/* ============================ kartu ============================ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px;letter-spacing:-.012em;display:flex;align-items:center;gap:8px}
.card-h h3 .i{display:none}
.card-h .meta{font-size:12.5px;color:var(--faint)}
.card-b{padding:18px}
.card-f{padding:12px 16px;border-top:1px solid var(--line);background:#FBFBFA;border-radius:0 0 var(--r) var(--r);font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack>*+*{margin-top:16px}

/* ringkasan: saldo + statistik */
.bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bal{padding:18px 18px 16px;display:flex;flex-direction:column;min-height:148px}
.bal-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bal-l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.bal-l .i{width:16px;height:16px;color:var(--faint)}
.bal-addr{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.bal-n{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:18px}
.bal-n small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.bal-f{margin-top:auto;padding-top:12px;font-size:12.5px;color:var(--faint)}
.bal.hero{background:linear-gradient(165deg,var(--accent-soft) 0%,var(--card) 58%);border-color:var(--accent-line)}
.bal.hero .bal-l,.bal.hero .bal-l .i{color:var(--accent-ink)}
.bal-empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:14px}
.bal-empty p{font-size:13.5px;color:var(--muted);max-width:36ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px}
.stat{padding:16px 18px}
.stat+.stat{border-left:1px solid var(--line)}
.stat-l{font-size:12.5px;color:var(--muted);font-weight:500}
.stat-n{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin-top:6px}
.stat-h{font-size:12px;color:var(--faint);margin-top:2px}

/* kartu kontrak */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.job{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;transition:border-color .15s,box-shadow .15s}
.job:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.job-id{font-size:12px;color:var(--faint);line-height:1.3;font-variant-numeric:tabular-nums}
.job-brand{font-size:15px;letter-spacing:-.015em;line-height:1.35}
.job-brand a::after{content:'';position:absolute;inset:0;border-radius:var(--r)}
.job-brand a:focus-visible{box-shadow:none}
.job-brand a:focus-visible::after{box-shadow:var(--ring)}
.job-brief{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.job-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line);margin-top:auto}
.job-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
.job-meta .amt{color:var(--ink);font-size:13.5px;font-weight:500}
.job-actions{position:relative;z-index:1}
.meter-bar{position:relative;height:6px;border-radius:999px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#A3AAB3}
.meter-fill.ok{background:var(--verify)}
.meter-fill.lo{background:#C9585F}
.meter-fill.mid{background:#C9A233}
.meter-tgt{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink)}
.meter-l{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.meter-l span:last-child{color:var(--faint)}

/* segmented control */
.seg-wrap{margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r);background:var(--sunken);border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:5px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .12s,color .12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(22,24,29,.08),0 0 0 1px var(--line)}
.seg .cnt{font-size:11.5px;color:var(--faint)}
.seg button.on .cnt{color:var(--muted)}

/* ============================ form ============================ */
.form{max-width:720px}
.fsec{padding:22px 24px}
.fsec+.fsec{border-top:1px solid var(--line)}
.fsec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.fsec-h h3{font-size:14px}
.fsec-h p{font-size:13px;color:var(--muted);margin-top:2px}
.field+.field{margin-top:18px}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px;font-size:13px;font-weight:500}
.label .opt{font-weight:400;font-size:12px;color:var(--faint)}
.input,.textarea{width:100%;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--card);box-shadow:inset 0 1px 1px rgba(22,24,29,.03);transition:border-color .12s,box-shadow .12s}
.textarea{height:auto;padding:10px 12px;line-height:1.6;resize:vertical;display:block}
.input::placeholder,.textarea::placeholder{color:#A6ACB4}
.input:hover,.textarea:hover{border-color:var(--line-3)}
.input:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.input.err,.textarea.err{border-color:var(--danger)}
.input.err:focus,.textarea.err:focus{box-shadow:0 0 0 3px rgba(165,38,47,.16)}
.input[readonly],.textarea[readonly]{background:var(--sunken);color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:7px}
.errm{font-size:12.5px;color:var(--danger);margin-top:7px;display:flex;align-items:flex-start;gap:6px}
.errm:empty{display:none}
.errm .i{width:14px;height:14px;margin-top:2px}
.affix{position:relative}
.affix .input{padding-right:58px}
.affix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);pointer-events:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-2 .field+.field{margin-top:0}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;transition:background .12s,border-color .12s}
.check:hover{background:#FBFBFA;border-color:var(--line-2)}
.check input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--primary);flex-shrink:0}
.check b{font-weight:500;display:block}
.check span{font-size:12.5px;color:var(--muted)}
.sum{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;font-size:13.5px}
.sum-row+.sum-row{border-top:1px solid var(--line)}
.sum-row dt{color:var(--muted)}
.sum-row dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.sum-row.total{font-weight:600}
.sum-row.total dt{color:var(--ink)}
.sum-row.total dd{font-weight:600}
.canon{margin-top:10px}
.canon summary{cursor:pointer;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;list-style:none}
.canon summary::-webkit-details-marker{display:none}
.canon summary:hover{color:var(--ink)}
.canon pre,.pre{margin:10px 0 0;padding:12px 14px;border-radius:var(--r-sm);background:var(--ink);color:#D6DAE0;font:12px/1.65 var(--mono);white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:240px}
.pre .k{color:#8C939C}
.ffoot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line);background:#FBFBFA;border-radius:0 0 var(--r) var(--r)}
.ffoot p{font-size:12.5px;color:var(--muted);max-width:44ch}

/* ============================ status transaksi ============================ */
.txw{display:inline-flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:100%}
.txw.block{display:flex;align-items:stretch}
.txs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--faint)}
.txs li{display:inline-flex;align-items:center;gap:5px}
.txs li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.txs li.d{color:var(--verify)}
.txs li.d::before{background:var(--verify)}
.txs li.a{color:var(--accent-ink);font-weight:500}
.txs li.a::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.txs .mono{font-size:11.5px}
.tx-msg{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;color:var(--muted);max-width:52ch}
.tx-msg .i{width:14px;height:14px;margin-top:2px;flex-shrink:0}
.tx-msg.err{color:var(--danger)}

/* ============================ callout ============================ */
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid;font-size:13px;line-height:1.55;color:var(--ink-2)}
.note>.i,.note>.spin{margin-top:2px;width:16px;height:16px}
.note b{font-weight:600;color:var(--ink)}
.note .mono{font-size:12px}
.note-info{background:var(--chain-soft);border-color:var(--chain-line)} .note-info>.i,.note-info>.spin{color:var(--chain)}
.note-warn{background:var(--warn-soft);border-color:var(--warn-line)} .note-warn>.i{color:var(--warn)}
.note-err{background:var(--danger-soft);border-color:var(--danger-line)} .note-err>.i{color:var(--danger)}
.note-ok{background:var(--verify-soft);border-color:var(--verify-line)} .note-ok>.i{color:var(--verify)}
.note-plain{background:var(--sunken);border-color:var(--line)} .note-plain>.i{color:var(--faint)}
.netbar{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:22px}
.netbar .note{flex:1;min-width:260px;border:0;padding:0;background:none}
.netbar-w{padding:10px 10px 10px 14px;border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:var(--r)}
.tech{margin-top:8px}
.tech summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.tech summary::-webkit-details-marker{display:none}
.tech summary:hover{color:var(--ink)}
.tech[open] summary .i{transform:rotate(90deg)}
.err-line{margin-top:8px;padding:8px 10px;border-radius:5px;background:rgba(255,255,255,.7);border:1px solid var(--danger-line);font:12px/1.5 var(--mono);color:var(--danger);word-break:break-word}

/* ============================ detail ============================ */
.back{display:inline-flex;align-items:center;gap:4px;margin:-4px 0 14px -6px;height:28px;padding:0 8px 0 4px;border-radius:5px;font-size:13px;color:var(--muted)}
.back:hover{background:var(--hover);color:var(--ink)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 24px;flex-wrap:wrap;margin-bottom:20px}
.dhead h1{font-size:28px;letter-spacing:-.03em;line-height:1.2}
.dhead .page-sub{max-width:68ch}
.dhead-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:7px;padding:10px 0 11px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-size:11.5px;color:var(--faint);background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:0 6px;line-height:17px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}

.tl{padding:6px 16px 8px}
.tl li{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;padding:9px 0}
.tl li:not(:last-child)::before{content:'';position:absolute;left:9.5px;top:31px;bottom:-9px;width:1px;background:var(--line-2)}
.tl li.done:not(:last-child)::before{background:var(--verify-line)}
.tl-dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);background:var(--card);margin-top:1px}
.tl-dot .i{width:11px;height:11px;stroke-width:3}
.tl li.done .tl-dot{background:var(--verify);border-color:var(--verify);color:#fff}
.tl li.active .tl-dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl li.active .tl-dot::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tl li.fail .tl-dot{background:var(--danger);border-color:var(--danger);color:#fff}
.tl li.skip .tl-dot{border-style:dashed}
.tl-t{font-size:13.5px;font-weight:500;color:var(--faint);line-height:1.4}
.tl li.done .tl-t,.tl li.active .tl-t,.tl li.fail .tl-t{color:var(--ink)}
.tl li.skip .tl-t{text-decoration:line-through;text-decoration-color:var(--line-3)}
.tl-s{font-size:12.5px;color:var(--faint);margin-top:1px}
.tl li.active .tl-s{color:var(--accent-ink)}
.tl li.fail .tl-s{color:var(--danger)}
.tl-m{font-size:12px;color:var(--faint);text-align:right;white-space:nowrap;line-height:1.5}
.tl-m .mono{font-size:11.5px}
.txl{color:var(--muted);font-family:var(--mono);font-size:11.5px;display:inline-flex;align-items:center;gap:3px}
.txl:hover{color:var(--accent-ink)}
.txl .i{width:11px;height:11px}

.qp li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px}
.qp li+li{border-top:1px solid var(--line)}
.qp-i{font-family:var(--mono);font-size:12px;color:var(--faint)}
.qp-q{font-size:13.5px;line-height:1.45}
.qp-f{display:flex;gap:6px}
.hit{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px 0 6px;border-radius:999px;border:1px solid;font:600 11px/1 var(--mono);letter-spacing:0}
.hit .i{width:11px;height:11px;stroke-width:2.8}
.hit.y{background:var(--verify-soft);border-color:var(--verify-line);color:var(--verify)}
.hit.n{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.hit.p{background:var(--card);border-color:var(--line-2);border-style:dashed;color:var(--faint)}
.hit.s{background:transparent;border-color:transparent;color:var(--line-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--faint)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:8px;height:8px;border-radius:50%;display:inline-block}
.lg-y{background:var(--verify)} .lg-n{background:#C9585F} .lg-p{border:1.5px dashed var(--line-3)}

.deliv{border-radius:var(--r-sm);background:var(--sunken);overflow:hidden}
.deliv-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--faint)}
.deliv-h b{font-weight:500;color:var(--muted)}
.deliv-b{padding:12px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;color:var(--ink-2);max-height:220px;overflow:auto}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.checks li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint)}
.checks li .i{width:14px;height:14px}
.checks li.ok{color:var(--verify)}
.counter{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.steps2{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint);margin-bottom:14px;flex-wrap:wrap}
.steps2 span{display:inline-flex;align-items:center;gap:6px}
.steps2 b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);font:600 10.5px/1 var(--sans);color:var(--muted)}
.steps2 .on{color:var(--ink);font-weight:500}
.steps2 .on b{background:var(--ink);border-color:var(--ink);color:#fff}
.steps2 .ok{color:var(--verify)}
.steps2 .ok b{background:var(--verify);border-color:var(--verify);color:#fff}
.who{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.prog{height:4px;border-radius:999px;background:var(--sunken);overflow:hidden;margin-top:10px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}

.kv{padding:4px 18px}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;font-size:13.5px}
.kv div+div{border-top:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.kv dd.sans{font-family:var(--sans);font-size:13px;font-weight:500}
.kv dd.dim{color:var(--faint)}
.fund{display:inline-flex;align-items:center;gap:7px}
.fund i{width:7px;height:7px;border-radius:50%;background:var(--faint)}

.radar-wrap{padding:8px 16px 16px;text-align:center}
.radar{width:100%;max-width:252px;display:block;margin:0 auto}
.rd-ring{fill:none;stroke:var(--line);stroke-width:1}
.rd-ring-2{stroke-dasharray:2 4}
.rd-sp{stroke-width:1.5;stroke-linecap:round}
.rd-sp.rd-y{stroke:var(--verify)} .rd-sp.rd-n{stroke:var(--danger-line)} .rd-sp.rd-p{stroke:var(--line-2);stroke-dasharray:3 4}
.rd-nd circle{stroke-width:1.5}
.rd-nd.rd-y circle{fill:var(--verify-soft);stroke:var(--verify)}
.rd-nd.rd-n circle{fill:var(--danger-soft);stroke:#D0767D}
.rd-nd.rd-p circle{fill:var(--card);stroke:var(--line-3);stroke-dasharray:3 3}
.rd-nd text{font:600 10px var(--mono)}
.rd-nd.rd-y text{fill:var(--verify)} .rd-nd.rd-n text{fill:var(--danger)} .rd-nd.rd-p text{fill:var(--faint)}
.rd-core{fill:var(--mark)}
.rd-core-t{fill:#fff;font:600 7.5px var(--sans);letter-spacing:.12em}
.score{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.score div{padding:12px 10px;text-align:center}
.score div+div{border-left:1px solid var(--line)}
.score b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score span{font-size:11.5px;color:var(--faint)}
.score .up{color:var(--verify)} .score .dn{color:var(--danger)}

.audit li{display:flex;align-items:flex-start;gap:10px;padding:9px 16px;font-size:13px}
.audit li+li{border-top:1px solid var(--line)}
.audit .ck{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-top:1px}
.audit .ck .i{width:11px;height:11px;stroke-width:3}
.audit .ck.y{background:var(--verify-soft);color:var(--verify);box-shadow:inset 0 0 0 1px var(--verify-line)}
.audit .ck.n{background:var(--danger-soft);color:var(--danger)}
.audit .ck.s{background:var(--sunken);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.audit small{display:block;font-size:12px;color:var(--faint)}
.formula{font:12px/1.6 var(--mono);color:var(--ink-2);background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:8px 10px}

.zone{position:relative;display:flex;height:30px;border-radius:var(--r-sm);overflow:visible;margin-top:26px}
.zone span{height:100%}
.zone span:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.zone span:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.z-ref{background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--danger-line)}
.z-grey{background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn-line)}
.z-rel{background:var(--verify-soft);box-shadow:inset 0 0 0 1px var(--verify-line)}
.zone-mk{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.zone-mk b{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font:600 11.5px/1 var(--sans);background:var(--ink);color:#fff;padding:4px 7px;border-radius:5px;white-space:nowrap}
.zone-l{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.zone-l span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.frm{width:100%;border-collapse:collapse;font-size:12.5px}
.frm td{padding:5px 0;white-space:nowrap;border:0}
.frm td:first-child{color:var(--muted);white-space:normal}
.frm td:last-child{text-align:right;font-family:var(--mono);font-size:12px}
.frm tr.res td{padding-top:9px;border-top:1px solid var(--line);color:var(--ink);font-weight:600}
.frm tr.res td:last-child{font-family:var(--sans);font-size:12.5px}

/* ============================ log oracle ============================ */
.log{overflow:hidden}
.log details+details{border-top:1px solid var(--line)}
.log summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;cursor:pointer;list-style:none;transition:background .12s}
.log summary::-webkit-details-marker{display:none}
.log summary:hover{background:#FBFBFA}
.log details[open] summary{background:#FBFBFA}
.log-m{min-width:0}
.log-q{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-s{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-top:2px}
.log-s a{color:var(--muted);font-weight:500}
.log-s a:hover{color:var(--accent-ink)}
.log-t{font-size:12px;color:var(--faint);white-space:nowrap;display:flex;align-items:center;gap:8px}
.log-t .i{width:14px;height:14px;transition:transform .15s}
.log details[open] .log-t .i{transform:rotate(180deg)}
.log-b{padding:4px 16px 16px;display:grid;gap:12px;background:#FBFBFA}
.qa{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 14px;font-size:13.5px}
.qa dt{font-size:12px;color:var(--faint);padding-top:2px}
.qa dd{margin:0}
.answer{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;line-height:1.6;color:var(--ink-2)}
mark{background:var(--verify-soft);color:var(--verify);font-weight:600;padding:0 3px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--verify-line)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--faint)}

/* ============================ tabel aktivitas ============================ */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--faint);padding:10px 16px;border-bottom:1px solid var(--line);background:#FBFBFA;white-space:nowrap}
th:first-child{border-radius:var(--r) 0 0 0} th:last-child{border-radius:0 var(--r) 0 0}
.table-wrap td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.table-wrap tbody tr:last-child td{border-bottom:0}
.table-wrap tbody tr{transition:background .12s}
.table-wrap tbody tr:hover{background:#FBFBFA}
.t-r{text-align:right}
.ty{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.ty-ic{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--sunken);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.ty-ic .i{width:13px;height:13px}
.ty-in .ty-ic{background:var(--chain-soft);color:var(--chain);box-shadow:inset 0 0 0 1px var(--chain-line)}
.ty-out .ty-ic{background:var(--verify-soft);color:var(--verify);box-shadow:inset 0 0 0 1px var(--verify-line)}
.ty-back .ty-ic{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.ty-x .ty-ic{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger-line)}
.flow{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.flow .i{width:12px;height:12px;color:var(--line-3)}
.flow .k{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink-2)}
td .amt{font-size:13.5px;font-weight:500;color:var(--ink)}
td .job-l{color:var(--ink-2);font-weight:500}
td .job-l:hover{color:var(--accent-ink)}

/* ============================ keadaan ============================ */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 24px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--card)}
.empty-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--sunken);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:14px}
.empty h3{font-size:15px}
.empty p{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:46ch}
.empty .btn{margin-top:18px}
.empty.is-err{border-style:solid;border-color:var(--danger-line)}
.empty.is-err .empty-ic{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger-line)}
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,#EEF0EE 25%,#F6F7F5 40%,#EEF0EE 60%);background-size:300% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

/* ============================ overlay ============================ */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(22,24,29,.36);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:fade .15s ease-out}
.modal{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-pop);overflow:hidden;animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 6px}
.modal-h h3{font-size:16px;letter-spacing:-.015em}
.modal-h p{font-size:13px;color:var(--muted);margin-top:4px}
.modal-b{padding:14px 20px 20px}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);background:#FBFBFA;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.modal-f .i{width:15px;height:15px;color:var(--faint);margin-top:1px}
.wopt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-align:left;transition:background .12s,border-color .12s,box-shadow .12s}
.wopt+.wopt{margin-top:8px}
.wopt:hover{border-color:var(--line-2);background:#FBFBFA;box-shadow:var(--sh-1)}
.wopt[disabled]{cursor:progress}
.wlogo{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;color:#fff;font:700 15px/1 var(--sans);flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.wname{font-weight:500;font-size:14px;display:block}
.wsub{font-size:12.5px;color:var(--faint);display:block}
.wopt .end{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.wopt .end .tag-verify{height:20px}
.wopt.dim{opacity:.62}
.connecting{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 8px 8px}
.connecting .wlogo{width:56px;height:56px;border-radius:14px;font-size:22px;position:relative}
.connecting .ring{position:absolute;inset:-6px;border-radius:18px;border:2px solid var(--accent-line);border-top-color:var(--accent);animation:spin 1s linear infinite}
.connecting h4{font-size:15px;margin-top:18px}
.connecting p{font-size:13px;color:var(--muted);margin-top:4px;max-width:30ch}

.menu{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-pop);z-index:45;animation:pop .14s ease-out;overflow:hidden}
.menu-h{padding:16px;border-bottom:1px solid var(--line)}
.menu-h .row{display:flex;align-items:center;gap:10px}
.menu-h .bal{font-size:22px;font-weight:600;letter-spacing:-.025em;margin-top:14px;padding:0;min-height:0;display:block}
.menu-h .bal small{font-size:13px;font-weight:500;color:var(--muted)}
.menu-list{padding:6px}
.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:var(--r-sm);font-size:13.5px;color:var(--ink-2);text-align:left}
.menu-list button:hover,.menu-list a:hover{background:var(--hover)}
.menu-list .i{width:16px;height:16px;color:var(--faint)}
.menu-list .danger{color:var(--danger)}
.menu-list .danger .i{color:var(--danger)}

.drawer-bg{position:fixed;inset:0;z-index:60;background:rgba(22,24,29,.3);animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(440px,100vw);display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line);box-shadow:var(--sh-pop);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:15px}
.drawer-b{padding:20px;overflow:auto}
.hsteps{counter-reset:s}
.hsteps li{position:relative;padding:0 0 18px 38px;font-size:13.5px;color:var(--muted)}
.hsteps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;font-weight:600;color:var(--ink)}
.hsteps li:not(:last-child)::after{content:'';position:absolute;left:11.5px;top:28px;bottom:4px;width:1px;background:var(--line)}
.hsteps b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.quote{margin-top:6px;padding:16px;border-radius:var(--r);background:var(--mark);color:#fff;font-size:15px;font-weight:500;letter-spacing:-.01em;line-height:1.45}

.toast{position:fixed;top:68px;right:20px;z-index:70;display:flex;gap:10px;align-items:flex-start;max-width:380px;padding:12px 12px 12px 14px;border-radius:var(--r);background:var(--ink);color:#F3F4F6;box-shadow:var(--sh-pop);font-size:13px;line-height:1.5;animation:pop .18s ease-out}
.toast>.i{width:16px;height:16px;margin-top:1px}
.toast.ok>.i{color:#6FCF8E} .toast.err>.i{color:#F08A90} .toast.info>.i{color:#9DB0F2}
.toast button{color:#8C939C;margin-left:4px}
.toast button:hover{color:#fff}
.toast button .i{width:14px;height:14px}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}

/* ============================ panel tinjau (hanya mockup) ============================ */
.rv-btn{position:fixed;right:20px;bottom:20px;z-index:55;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;box-shadow:var(--sh-pop)}
.rv-btn .i{width:15px;height:15px}
.rv-btn .pip{width:6px;height:6px;border-radius:50%;background:#F5B544}
.rv{position:fixed;right:20px;bottom:66px;z-index:55;width:336px;max-height:calc(100vh - 96px);overflow:auto;padding:14px;border-radius:var(--r-lg);background:#1B1E24;color:#D9DCE1;box-shadow:var(--sh-pop);font-size:12.5px;animation:pop .16s ease-out}
.rv h4{color:#fff;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.rv>p{color:#8E949D;font-size:12px;margin-top:3px}
.rv-d{color:#AEB4BC;font-size:12px;line-height:1.5;margin-top:8px}
.rv-l{color:#8E949D;font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:14px 0 6px}
.rv .seg{background:#262A31;border-color:#30353D;flex-wrap:wrap}
.rv .seg button{color:#A9AFB8;height:26px;padding:0 9px;font-size:12px}
.rv .seg button:hover{color:#fff}
.rv .seg button.on{background:#3A404A;color:#fff;box-shadow:none}
.rv-links{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid #2C3037}
.rv-links button{flex:1;height:30px;border-radius:6px;background:#262A31;color:#D9DCE1;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.rv-links button:hover{background:#30353D;color:#fff}
.rv-links .i{width:14px;height:14px}

/* ============================ sistem desain ============================ */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sw{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.sw i{display:block;height:56px;border-bottom:1px solid var(--line)}
.sw div{padding:9px 11px}
.sw b{display:block;font-size:12.5px;font-weight:600}
.sw span{display:block;font-size:11.5px;color:var(--faint)}
.sw .mono{font-size:11.5px;color:var(--muted)}
.row-wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.st-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 16px}
.st-list div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.st-list code{font:11.5px var(--mono);color:var(--faint)}
.type-row{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.type-row code{font:11.5px var(--mono);color:var(--faint)}


.mono-tile{display:inline-grid;place-items:center;flex-shrink:0;border-radius:28%;font-weight:700;letter-spacing:-.02em;line-height:1;
  color:hsl(var(--h) 48% 26%);background:linear-gradient(150deg,hsl(var(--h) 62% 95%),hsl(var(--h) 52% 85%));box-shadow:inset 0 0 0 1px hsl(var(--h) 38% 79%)}
.job-who{display:flex;align-items:center;gap:12px;min-width:0}
.dhead-l{display:flex;align-items:flex-start;gap:16px;min-width:0}
.dhead-l .mono-tile{margin-top:4px}
.bal-split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.bal-split>div>span{display:block;font-size:12.5px;color:var(--muted)}
.bal-split b{display:block;font-size:16px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.spark{display:block;width:100%;height:46px;margin-top:14px;color:var(--accent)}
.trend{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trend-v{font-weight:600;font-variant-numeric:tabular-nums}
.trend-v.up{color:var(--verify)} .trend-v.dn{color:var(--danger)}
.stat-l{display:flex;align-items:center;gap:8px}
.stat-ic{display:none;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.stat-ic .i{width:14px;height:14px}
@media (max-width:767px){ .dhead-l{flex-direction:column;gap:12px} .dhead-l .mono-tile{width:44px!important;height:44px!important;font-size:17px!important;margin-top:0} }

/* =====================================================================
   GAYA PREMIUM — lapisan di atas gaya minimal. Tata letak TIDAK berubah;
   yang berubah: kedalaman latar, sidebar gelap, kartu hero, bayangan
   berlapis, huruf. Matikan dengan data-style="minimal".
   ===================================================================== */
:root[data-style="premium"]{
  --sans:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --r-sm:9px; --r-lg:18px;
  --line:#E7EAED;
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 3px 10px -3px rgba(16,24,40,.07);
  --sh-2:0 2px 4px rgba(16,24,40,.04),0 18px 36px -14px rgba(16,24,40,.20);
}
[data-style="premium"] body{letter-spacing:0;word-spacing:.06em;font-feature-settings:normal}
[data-style="premium"] .mono{word-spacing:0}
/* latar: cahaya merek + grid titik yang memudar */
[data-style="premium"] .main{position:relative;isolation:isolate}
[data-style="premium"] .main::before{content:'';position:absolute;inset:0 0 auto 0;height:620px;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 440px at 82% -160px,color-mix(in srgb,var(--accent) 17%,transparent),transparent 70%),
             radial-gradient(760px 380px at 4% -180px,color-mix(in srgb,var(--chain) 9%,transparent),transparent 70%)}
[data-style="premium"] .main::after{content:'';position:absolute;inset:0 0 auto 0;height:560px;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(16,24,40,.075) 1px,transparent 1.3px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,transparent 100%)}
[data-style="premium"] .top{background:color-mix(in srgb,var(--paper) 72%,transparent);border-bottom-color:rgba(16,24,40,.06)}
/* judul */
[data-style="premium"] .page-head h1{font-size:30px;font-weight:700;letter-spacing:-.032em}
[data-style="premium"] .dhead h1{font-size:30px;font-weight:700;letter-spacing:-.032em}
[data-style="premium"] .sec-head h2{font-size:16px;font-weight:700}
[data-style="premium"] .card-h h3{font-weight:700}
[data-style="premium"] .job-brand{font-size:15.5px;font-weight:700}
/* kartu berlapis */
[data-style="premium"] .card{border-color:rgba(16,24,40,.07);box-shadow:var(--sh-1)}
[data-style="premium"] .card-h{border-bottom-color:rgba(16,24,40,.06)}
[data-style="premium"] .card-f{background:transparent;border-top-color:rgba(16,24,40,.06)}
[data-style="premium"] .job{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
[data-style="premium"] .job:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:rgba(16,24,40,.09)}
[data-style="premium"] .meter-fill{background:linear-gradient(90deg,#CBD0D6,#9CA3AC)}
[data-style="premium"] .meter-fill.ok{background:linear-gradient(90deg,#5FB47F,var(--verify))}
[data-style="premium"] .meter-fill.lo{background:linear-gradient(90deg,#E39AA0,#C24C55)}
[data-style="premium"] .meter-fill.mid{background:linear-gradient(90deg,#E8CE7A,#C9A233)}
/* tombol */
[data-style="premium"] .btn{border-radius:10px;font-weight:600}
[data-style="premium"] .btn-sm{border-radius:8px}
[data-style="premium"] .btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 84%,#fff),var(--primary));box-shadow:0 1px 2px rgba(16,24,40,.22),0 8px 18px -8px color-mix(in srgb,var(--primary) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.2)}
[data-style="premium"] .btn-primary:hover{background:linear-gradient(180deg,var(--primary),var(--primary-hi))}
[data-style="premium"] .seg{border-radius:11px}
[data-style="premium"] .seg button{border-radius:8px}
/* kartu hero: saldo kontrak */
[data-style="premium"] .bal.hero{position:relative;overflow:hidden;border:0;color:#fff;
  background:radial-gradient(420px 240px at 100% 0%,color-mix(in srgb,var(--mark-dot) 34%,transparent),transparent 70%),
             linear-gradient(150deg,var(--mark) 0%,color-mix(in srgb,var(--primary) 72%,var(--mark)) 100%);
  box-shadow:0 18px 40px -18px color-mix(in srgb,var(--mark) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.12)}
[data-style="premium"] .bal.hero::after{content:'';position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 0 36px rgba(255,255,255,.025),0 0 0 37px rgba(255,255,255,.07),0 0 0 76px rgba(255,255,255,.02),0 0 0 77px rgba(255,255,255,.05);pointer-events:none}
[data-style="premium"] .bal.hero .bal-l,[data-style="premium"] .bal.hero .bal-l .i{color:rgba(255,255,255,.82)}
[data-style="premium"] .bal.hero .bal-n{color:#fff}
[data-style="premium"] .bal.hero .bal-n small{color:rgba(255,255,255,.62)}
[data-style="premium"] .bal.hero .bal-addr{color:rgba(255,255,255,.72)}
[data-style="premium"] .bal.hero .bal-addr:hover{color:#fff}
[data-style="premium"] .bal.hero .bal-f{color:rgba(255,255,255,.66)}
[data-style="premium"] .bal.hero .spark{color:#fff}
[data-style="premium"] .bal.hero .trend{color:rgba(255,255,255,.7)}
[data-style="premium"] .bal.hero .trend-v{color:#fff;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:999px}
/* statistik dengan ikon */
[data-style="premium"] .stat-ic{display:inline-grid}
[data-style="premium"] .stat-n{font-size:28px;font-weight:700}
/* radar */
[data-style="premium"] .radar-wrap{background:radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 62%)}
/* sidebar gelap — desktop & tablet saja; tab bar ponsel tetap terang */
@media (min-width:768px){
  [data-style="premium"] .side{background:linear-gradient(180deg,var(--mark) 0%,color-mix(in srgb,var(--mark) 78%,#05080a) 100%);border-right:0;color:#fff}
  [data-style="premium"] .side .brand-mark rect{fill:rgba(255,255,255,.12)!important}
  [data-style="premium"] .brand-name{color:#fff}
  [data-style="premium"] .brand-sub{color:rgba(255,255,255,.6)}
  [data-style="premium"] .nav-label{color:rgba(255,255,255,.6)}
  [data-style="premium"] .nav-link{color:rgba(255,255,255,.78)}
  [data-style="premium"] .nav-link .i{color:rgba(255,255,255,.55)}
  [data-style="premium"] .nav-link:hover{background:rgba(255,255,255,.07);color:#fff}
  [data-style="premium"] .nav-link:hover .i{color:rgba(255,255,255,.8)}
  [data-style="premium"] .nav-link.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  [data-style="premium"] .nav-link.on .i{color:var(--mark-dot)}
  [data-style="premium"] .wmini{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  [data-style="premium"] .wmini p,[data-style="premium"] .wmini-prov{color:rgba(255,255,255,.62)}
  [data-style="premium"] .wmini-addr,[data-style="premium"] .wmini-bal{color:#fff}
  [data-style="premium"] .wmini-bal small{color:rgba(255,255,255,.62)}
  [data-style="premium"] .side-meta{color:rgba(255,255,255,.6)}
  [data-style="premium"] .side-meta a:hover{color:#fff}
}
@media (min-width:768px) and (max-width:1023px){
  [data-style="premium"] .nav-label{background:rgba(255,255,255,.14)}
}

/* =====================================================================
   RESPONSIF — desktop ≥1024 · tablet 768–1023 (rail ikon) · ponsel ≤767 (tab bar)
   ===================================================================== */
@media (max-width:1180px){
  .detail{grid-template-columns:1fr}
  .detail-r{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .detail-r.stack>*+*{margin-top:0}
}
@media (max-width:1023px){
  :root{--side:72px}
  .side{padding:14px 10px}
  .brand{justify-content:center;padding:4px 0 14px}
  .brand-txt,.nl-full,.nl-short,.side-foot{display:none}
  .nav-label{height:1px;padding:0;margin:10px 8px;background:var(--line);font-size:0}
  .nav-group:first-child .nav-label{display:none}
  .nav-link{justify-content:center;padding:0;height:40px}
  .nav-link .i{width:20px;height:20px}
  .content{padding:24px 24px 72px}
  .top{padding:0 24px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:767px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);z-index:50}
  .brand,.nav-label{display:none!important}
  .nav{display:flex;width:100%}
  .nav-group{display:contents}
  .nav-group+.nav-group{margin:0}
  .nav-link{flex:1;flex-direction:column;justify-content:center;gap:3px;height:54px;padding:0 2px;font-size:10.5px;font-weight:500;border-radius:8px}
  .nav-link .i{width:20px;height:20px}
  .nav-link .nl-short{display:block}
  .nav-link.on{background:transparent;color:var(--accent-ink)}
  .nav-link.on .i{color:var(--accent)}
  .nav-link:hover{background:transparent}
  .top{padding:0 16px;gap:10px}
  .top-brand{display:block}
  .crumbs .hide-sm-c{display:none}
  .hide-sm{display:none}
  .show-sm{display:inline}
  .acct .mono,.acct .i{display:none}
  .acct{padding:0 6px}
  .content{padding:20px 16px 104px}
  .page-head{margin-bottom:20px}
  .page-head h1{font-size:21px}
  .dhead h1{font-size:22px}
  .bal-grid,.grid-2{grid-template-columns:1fr}
  .bal{min-height:0}
  .bal-n{font-size:26px;margin-top:14px}
  .jobs{grid-template-columns:1fr}
  .fsec{padding:18px 16px}
  .ffoot{padding:14px 16px}
  .ffoot .txw,.ffoot .btn{width:100%}
  .detail-r{grid-template-columns:1fr}
  .tl li{grid-template-columns:20px minmax(0,1fr)}
  .tl-m{grid-column:2;text-align:left;margin-top:-4px}
  .qp li{grid-template-columns:24px minmax(0,1fr);row-gap:8px}
  .qp-f{grid-column:2}
  .log summary{grid-template-columns:auto minmax(0,1fr)}
  .log-t{grid-column:2}
  .qa{grid-template-columns:1fr}
  .qa dt{padding-top:0}

let ACT_SEQ = 0;
const BLOCK0 = 48210000, T_BLOCK0 = NOW - 30 * D;
function mkAct(job, type, amount, from, to, note, ts) {
  return { id: 'a' + (++ACT_SEQ), job_id: job.job_id, tx_hash: fakeHash('tx' + type + job.job_id + ts), block_number: BLOCK0 + Math.floor((ts - T_BLOCK0) / 450) + ACT_SEQ,
    type: type, amount_wei: amount == null ? null : String(amount), from_addr: from, to_addr: to, note: note || null, created_at: ts };
}
const enginesOf = job => job.multi_engine ? ['claude-ringkas', 'claude-naratif'] : ['claude-ringkas'];
function makeRun(job, phase, qi, engine, hit, ts) {
  return { id: 'r' + job.job_id + phase[0] + qi + engine, job_id: job.job_id, phase: phase, query_index: qi, query: job.queries[qi],
    engine: engine, model: MODEL, hit: !!hit, answer: answerFor(job, engine, hit), latency_ms: 900 + Math.floor(rng(job.job_id + phase + qi + engine)() * 2400), created_at: ts };
}
/* hit per-engine: kalau gabungannya 0, gaya ringkas kadang tetap menyebut — memperlihatkan aturan every() */
const engineHit = (job, qi, engine, agg) => agg ? 1 : (job.multi_engine && engine === 'claude-ringkas' && qi % 2 === 0 ? 1 : 0);

function buildJob(d, t0, deadlineAt) {
  const n = d.q.length, budget = toWei(d.budget);
  const freel = d.freelancer || null;
  const past = !!freel && ['Verifying', 'Disputed', 'ReleasedFull', 'Refunded'].includes(d.status);
  const job = {
    job_id: d.id, brand: d.brand, brief: d.brief || null, queries: d.q.slice(), target_count: d.target, multi_engine: !!d.multi,
    query_pool_hash: fakeHash('pool' + d.id + d.brand), client_addr: d.client, freelancer_addr: freel,
    budget_wei: budget, bond_wei: freel ? (BigInt(budget) * BOND_BPS / 10000n).toString() : null,
    structural_released_wei: past ? (BigInt(budget) * STRUCT_BPS / 10000n).toString() : '0',
    deliverable_content: null, deliverable_hash: null,
    baseline_score: null, baseline_of: null, baseline_at: null,
    verification_seed: null, verification_subset: null, verification_score: null, verification_of: null, verification_decision: null, verdict_hash: null,
    status: d.status, job_state: d.state || 'idle', settled_by: d.settled || null, last_error: d.lastError || null,
    accept_deadline: deadlineAt, created_at: t0,
    _cat: d.cat, _usp: d.usp, _rejected: !!d.rejected, _runs: [], _steps: {}, _baseHits: d.base, _verifHits: d.verif ? d.verif.hits : null,
  };
  const S = job._steps, span = Math.max(Date.now() - t0, 1), at = f => t0 + Math.round(span * f);
  const tStruct = d.structAgo != null ? Date.now() - d.structAgo : at(.62);
  const pre = f => t0 + Math.round((tStruct - t0) * f);
  S.created = { ts: t0, tx: fakeHash('create' + d.id) };

  const baseDone = d.baseDone != null ? d.baseDone : (d.base ? n : 0);
  for (let qi = 0; qi < baseDone; qi++) enginesOf(job).forEach(e => job._runs.push(makeRun(job, 'baseline', qi, e, engineHit(job, qi, e, d.base[qi]), t0 + 4000 + qi * 3000)));
  if (d.base && d.baseDone == null) { job.baseline_score = d.base.reduce((a, b) => a + b, 0); job.baseline_of = n; job.baseline_at = t0 + 25000; S.baseline = { ts: job.baseline_at }; }

  if (freel) S.accepted = { ts: past ? pre(.45) : at(.35), tx: fakeHash('accept' + d.id) };
  if (freel && (past || d.status === 'Submitted' || d.rejected)) S.submitted = { ts: past ? pre(.85) : at(.6), tx: fakeHash('submit' + d.id) };
  if (freel && (past || d.status === 'Submitted')) { job.deliverable_content = deliverableFor(job); job.deliverable_hash = fakeHash('deliv' + job.deliverable_content); job.deliverable_submitted_at = S.submitted.ts; }
  if (past) S.structural = { ts: tStruct, tx: fakeHash('struct' + d.id) };

  if (d.verif) {
    const done = d.verif.done != null ? d.verif.done : d.verif.subset.length;
    const tv = S.structural.ts + 60000;
    job.verification_seed = fakeHash('seed' + d.id);
    job.verification_subset = d.verif.subset.slice();
    for (let k = 0; k < done; k++) {
      const qi = d.verif.subset[k];
      enginesOf(job).forEach(e => job._runs.push(makeRun(job, 'verification', qi, e, engineHit(job, qi, e, d.verif.hits[k]), tv + k * 3500)));
    }
    if (done === d.verif.subset.length) {
      job.verification_score = d.verif.hits.reduce((a, b) => a + b, 0);
      job.verification_of = d.verif.subset.length;
      job.verification_decision = decide(job.verification_score, job.verification_of, job.target_count, n);
      job.verification_at = tv + done * 3500;
      job.verdict_hash = fakeHash('verdict' + d.id);
      S.verified = { ts: job.verification_at };
    }
  }
  if (SETTLED.includes(d.status) && freel) S.settled = { ts: Math.max(at(.92), (S.verified ? S.verified.ts : 0) + 3 * H), tx: fakeHash('settle' + d.id) };
  job._stuck = d.status === 'Verifying' && job.job_state !== 'running_verify' && !!S.structural && Date.now() - S.structural.ts > VERIFY_TIMEOUT;
  return job;
}

function actsForJob(job) {
  const S = job._steps, out = [], bond = job.bond_wei, remaining = (BigInt(job.budget_wei) - BigInt(job.structural_released_wei)).toString();
  out.push(mkAct(job, 'deposit', job.budget_wei, job.client_addr, CONTRACT, 'Budget dikunci', S.created.ts));
  if (S.accepted) out.push(mkAct(job, 'bond_lock', bond, job.freelancer_addr, CONTRACT, 'Bond freelancer dikunci', S.accepted.ts + 1000));
  if (job._rejected) out.push(mkAct(job, 'structural_rejected', null, ORACLE, CONTRACT, job.last_error, S.submitted.ts + 90000));
  if (S.structural) out.push(mkAct(job, 'structural_release', job.structural_released_wei, CONTRACT, job.freelancer_addr, 'Lolos cek struktural', S.structural.ts));
  if (job.verification_decision === 'dispute') out.push(mkAct(job, 'dispute_raised', null, ORACLE, CONTRACT, 'Skor di zona abu', S.verified.ts + 5000));
  if (S.settled) {
    const toF = job.status === 'ReleasedFull', byA = job.settled_by === 'arbiter';
    out.push(mkAct(job, byA ? (toF ? 'jury_release' : 'jury_refund') : (toF ? 'final_release' : 'final_refund'), remaining, CONTRACT, toF ? job.freelancer_addr : job.client_addr, toF ? 'Sisa budget cair' : 'Sisa budget kembali ke client', S.settled.ts));
    out.push(mkAct(job, toF ? 'bond_return' : 'bond_slash', bond, CONTRACT, toF ? job.freelancer_addr : job.client_addr, toF ? 'Bond dikembalikan' : 'Bond di-slash ke client', S.settled.ts + 1));
  }
  return out;
}

/* gabung hit per pertanyaan — PERSIS lib/oracle/runner.ts:170-184:

function hitsFor(job, phase) {
  const engines = enginesOf(job), per = new Map(), out = new Map();
  for (const r of job._runs) if (r.phase === phase) { if (!per.has(r.query_index)) per.set(r.query_index, {}); per.get(r.query_index)[r.engine] = r.hit; }
  for (const [qi, m] of per) if (engines.every(e => e in m)) out.set(qi, engines.every(e => m[e]));
  return out;
}

   HALAMAN
   ===================================================================== */
const FLOW_IN = new Set(['deposit', 'bond_lock']);
const FLOW_OUT = new Set(['structural_release', 'final_release', 'final_refund', 'jury_release', 'jury_refund', 'bond_return', 'bond_slash', 'reclaim']);
function balanceAt(t) {
  let b = 0n;
  for (const e of state.activity) {
    if (e.amount_wei == null || e.created_at > t) continue;
    if (FLOW_IN.has(e.type)) b += BigInt(e.amount_wei); else if (FLOW_OUT.has(e.type)) b -= BigInt(e.amount_wei);
  }
  return b;
}
function sparkSvg(vals) {
  const W = 300, Hh = 46, max = Math.max.apply(null, vals), min = Math.min.apply(null, vals), r = (max - min) || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * W, Hh - 4 - (v - min) / r * (Hh - 10)]);
  const line = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + Hh + '" preserveAspectRatio="none" role="img" aria-label="Tren saldo kontrak 21 hari"><defs><linearGradient id="spg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".26"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + line + ' L' + W + ' ' + Hh + ' L0 ' + Hh + ' Z" fill="url(#spg)"/><path d="' + line + '" fill="none" stroke="currentColor" stroke-width="1.75" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
/* dana milik wallet ini yang masih di kontrak, dan yang sudah diterima dari kontrak */
function walletSplit(a) {
  let locked = 0n, got = 0n;
  for (const j of state.jobs) {
    if (SETTLED.includes(j.status)) continue;
    if (same(j.client_addr, a.addr)) locked += BigInt(j.budget_wei) - BigInt(j.structural_released_wei);
    if (same(j.freelancer_addr, a.addr) && j.bond_wei) locked += BigInt(j.bond_wei);
  }
  for (const e of state.activity) if (e.amount_wei != null && FLOW_OUT.has(e.type) && same(e.to_addr, a.addr)) got += BigInt(e.amount_wei);
  return '<div class="bal-split"><div><span>Terkunci atas nama Anda</span><b>' + money(locked.toString()) + '</b></div><div><span>Diterima dari kontrak</span><b>' + money(got.toString()) + '</b></div></div>';
}
function heroTrend() {
  const N = 30, t1 = Date.now(), t0 = t1 - 21 * D, vals = [];
  // Number() di sini HANYA untuk menggambar grafik — angka yang DITAMPILKAN tetap BigInt lewat amt()
  for (let i = 0; i < N; i++) vals.push(Number(balanceAt(t0 + (t1 - t0) * i / (N - 1))) / 1e18);
  const d7 = balanceAt(t1) - balanceAt(t1 - 7 * D);
  const sign = d7 > 0n ? '+' : d7 < 0n ? '−' : '±';
  return sparkSvg(vals) + '<div class="trend"><span class="trend-v ' + (d7 >= 0n ? 'up' : 'dn') + '">' + sign + amt(d7 < 0n ? -d7 : d7) + ' tBNB</span><span>7 hari terakhir</span></div>';
}

const parseQueries = s => s.replace(/\r/g, '').split('\n').map(x => x.trim()).filter(Boolean);
function parseBudget(s) { const t = String(s).trim().replace(',', '.'); return /^\d+(\.\d{1,18})?$/.test(t) ? BigInt(toWei(t)) : null; }
function canonicalPool(d) {
  const qs = parseQueries(d.queries);
  return ['GEOv1', d.brand.trim(), String(parseInt(d.target, 10) || 0), d.multi ? '1' : '0', String(qs.length)].concat(qs).join('\n');
}
function validateDraft(d) {
  const e = {}, qs = parseQueries(d.queries), a = acct(), brand = d.brand.trim();

const STEPS = [

function stepDone(job, k) {

    case 'baseline':   return job.baseline_score != null ? job.baseline_score + ' dari ' + n + ' pertanyaan menyebut brand' : null;
    case 'accepted':   return job.bond_wei ? 'Bond ' + formatTBNB(job.bond_wei) + ' dikunci · ' + shortAddr(job.freelancer_addr) : null;
    case 'structural': return job.structural_released_wei !== '0' ? formatTBNB(job.structural_released_wei) + ' cair ke freelancer' : null;
    case 'verified':   return job.verification_score != null ? job.verification_score + ' dari ' + job.verification_of + ' pertanyaan acak menyebut brand' : null;

  }

}
function stepPos(job, ui) {
  return { baseline_running: [1], baseline_failed: [1, 1], open: [2], in_progress: [3], submitted_pending: [4], structural_failed: [4, 1],
    awaiting_verify: [5], verifying: [5], dispute: [6] }[ui] || [7];

function timelineCard(job, ui) {
  const reclaimed = job.status === 'Refunded' && !job.freelancer_addr;

  const items = STEPS.map((st, i) => {

    if (reclaimed && i >= 2 && i <= 5) { c = 'skip'; sub = 'Dilewati'; }
    if (reclaimed && i === 6) { sub = 'Budget ditarik kembali oleh client'; }
    if (i === 1 && ui === 'baseline_running') sub = 'Oracle sedang bertanya ke AI…';
    if (i === 1 && fail && ui === 'baseline_failed') sub = 'Gagal — bisa diukur ulang';
    if (i === 2 && ui === 'open' && expired(job)) sub = 'Batas ambil lewat · client bisa menarik dana';
    if (i === 3 && ui === 'in_progress' && job._rejected) sub = 'Kiriman sebelumnya ditolak · menunggu kiriman ulang';
    if (i === 4 && ui === 'submitted_pending') sub = 'Oracle sedang mengonfirmasi ke kontrak…';
    if (i === 4 && ui === 'structural_failed') sub = 'Konfirmasi gagal — gangguan sistem';
    if (i === 5 && ui === 'verifying') sub = 'Oracle bertanya ulang ke AI…';
    if (i === 5 && job._stuck) sub = 'Macet melewati batas waktu verifikasi';
    if (i === 6 && ui === 'dispute') sub = 'Zona abu — menunggu putusan arbiter';
    if (i === 6 && (ui === 'jury_release' || ui === 'jury_refund')) sub = 'Diputus oleh arbiter';
    const s = job._steps[st.k];
    let meta = '';
    if (c === 'done' && s) meta = formatTime(s.ts) + (st.chain && s.tx ? '<br><button class="txl" data-act="noop-tx" title="Lihat transaksi">' + shortHash(s.tx) + ic('ext') + '</button>' : '<br><span>oleh Oracle</span>');
    const dot = c === 'done' ? ic('check') : c === 'fail' ? ic('x') : '';
    return '<li class="' + c + '"><span class="tl-dot">' + dot + '</span><div><div class="tl-t">' + st.t + '</div><div class="tl-s">' + sub + '</div></div><div class="tl-m">' + meta + '</div></li>';
  }).join('');

let toastTimer = null;
function toast(type, msg) {
  state.toast = { type: type, msg: msg };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 4800);
}
function runTx(key) {
  const mode = state.review.tx;
  const set = (phase, extra) => { state.tx[key] = Object.assign({}, state.tx[key], { phase: phase }, extra || {}); render(); };
  set('sign');
  setTimeout(() => {
    if (mode === 'rejected') { set('rejected'); return; }
    set('sent', { hash: fakeHash('tx' + key + Date.now()) });
    setTimeout(() => {
      set('confirm');
      setTimeout(() => {
        if (mode === 'reverted') { set('reverted'); toast('err', 'Transaksi ditolak kontrak (revert). Dana tidak berpindah.'); render(); return; }
        set('sync');
        setTimeout(() => { const h = state.tx[key].hash; delete state.tx[key]; txDone(key, h); render(); }, 650);
      }, 1300);
    }, 550);
  }, 1300);
}
function settle(job, toF, by, ts) {
  const remaining = BigInt(job.budget_wei) - BigInt(job.structural_released_wei), bond = job.bond_wei ? BigInt(job.bond_wei) : 0n;
  job.status = toF ? 'ReleasedFull' : 'Refunded'; job.settled_by = by; job.job_state = 'idle';
  job._steps.settled = { ts: ts, tx: fakeHash('settle' + job.job_id + ts) };
  const to = toF ? job.freelancer_addr : job.client_addr;
  pushAct(mkAct(job, by === 'arbiter' ? (toF ? 'jury_release' : 'jury_refund') : (toF ? 'final_release' : 'final_refund'), remaining, CONTRACT, to, toF ? 'Sisa budget cair' : 'Sisa budget kembali ke client', ts));
  if (bond) pushAct(mkAct(job, toF ? 'bond_return' : 'bond_slash', bond, CONTRACT, to, toF ? 'Bond dikembalikan' : 'Bond di-slash ke client', ts + 1));
  addBal(to, remaining + bond);
}
function txDone(key, hash) {
  const parts = key.split(':'), name = parts[0], job = getJob(Number(parts[1])), a = acct(), now = Date.now();
  if (name === 'create') {
    const p = state.pending, id = Math.max.apply(null, state.jobs.map(j => j.job_id)) + 1;
    const nj = buildJob({ id: id, brand: state.draft.brand.trim(), brief: state.draft.brief.trim(), cat: 'produk ' + state.draft.brand.trim(), usp: 'kualitasnya konsisten', q: p.qs, target: Number(state.draft.target), multi: state.draft.multi,
      budget: amt(p.b), client: a.addr, status: 'Open', state: 'running_baseline', base: p.qs.map((_, i) => i === 0 ? 1 : 0), baseDone: 0 }, now, p.dl);
    nj._steps.created.tx = hash;
    state.jobs.push(nj);
    pushAct(mkAct(nj, 'deposit', nj.budget_wei, a.addr, CONTRACT, 'Budget dikunci', now));
    addBal(a.addr, -(p.b + GAS_WEI));
    state.draft = defaultDraft(); state.draftTried = false; state.detailTab = 'overview';
    location.hash = '#/jobs/' + id;
    toast('ok', 'Kontrak #' + id + ' dibuat. Oracle mulai mengukur baseline.');
    simulateRuns(nj, 'baseline', p.qs.map((_, i) => i), () => { nj.baseline_score = nj._baseHits.reduce((x, y) => x + y, 0); nj.baseline_of = nj.queries.length; nj.job_state = 'idle'; nj._steps.baseline = { ts: Date.now() }; toast('ok', 'Baseline "' + nj.brand + '" terukur: ' + nj.baseline_score + '/' + nj.baseline_of + ' menyebut brand.'); });
    return;
  }
  if (!job) return;
  if (name === 'accept') {
    job.status = 'Accepted'; job.freelancer_addr = a.addr; job.bond_wei = (BigInt(job.budget_wei) * BOND_BPS / 10000n).toString();
    job._steps.accepted = { ts: now, tx: hash };
    pushAct(mkAct(job, 'bond_lock', job.bond_wei, a.addr, CONTRACT, 'Bond freelancer dikunci', now));
    addBal(a.addr, -(BigInt(job.bond_wei) + GAS_WEI));
    toast('ok', 'Kontrak #' + job.job_id + ' diambil. Bond ' + formatTBNB(job.bond_wei) + ' dikunci.');
    if (location.hash !== '#/jobs/' + job.job_id) location.hash = '#/jobs/' + job.job_id;
  } else if (name === 'submit') {
    const st = state.deliv[job.job_id];
    job.status = 'Submitted'; job.job_state = 'running_structural'; job._rejected = false; job.last_error = null;
    job.deliverable_content = st.text.trim(); job.deliverable_hash = st.check.hash; job.deliverable_submitted_at = now;
    job._steps.submitted = { ts: now, tx: hash };
    addBal(a.addr, -GAS_WEI);
    delete state.deliv[job.job_id];
    toast('ok', 'Hash konten terkunci on-chain. Oracle mengonfirmasi cek struktural…');
    setTimeout(() => confirmStructural(job), 2600);
  } else if (name === 'release' || name === 'refund') {
    settle(job, name === 'release', 'arbiter', now);
    addBal(a.addr, -GAS_WEI);
    toast('ok', name === 'release' ? 'Diputus: dana cair ke freelancer.' : 'Diputus: dana dikembalikan ke client.');
  } else if (name === 'reclaim') {
    job.status = 'Refunded'; job._steps.settled = { ts: now, tx: hash };
    pushAct(mkAct(job, 'reclaim', job.budget_wei, CONTRACT, job.client_addr, 'Batas ambil lewat · ditarik client', now));
    addBal(job.client_addr, BigInt(job.budget_wei) - GAS_WEI);
    toast('ok', formatTBNB(job.budget_wei) + ' kembali ke wallet Anda.');
  } else if (name === 'escalate') {
    job.status = 'Disputed'; job._stuck = false;
    pushAct(mkAct(job, 'dispute_raised', null, a.addr, CONTRACT, 'Dieskalasi: macet melewati verifyTimeout', now));
    addBal(a.addr, -GAS_WEI);
    toast('ok', 'Job dieskalasi ke arbiter.');
  }
}
function confirmStructural(job) {
  const now = Date.now();
  job.status = 'Verifying'; job.job_state = 'idle';
  job.structural_released_wei = (BigInt(job.budget_wei) * STRUCT_BPS / 10000n).toString();
  job._steps.structural = { ts: now, tx: fakeHash('struct' + job.job_id + now) };
  pushAct(mkAct(job, 'structural_release', job.structural_released_wei, CONTRACT, job.freelancer_addr, 'Lolos cek struktural', now));
  addBal(job.freelancer_addr, job.structural_released_wei);
  toast('ok', 'Lolos cek struktural — ' + formatTBNB(job.structural_released_wei) + ' cair ke freelancer.');
  render();
}
/* simulasi Oracle: jawaban masuk satu per satu — di FE sungguhan ini polling (Fase 9) */
function simulateRuns(job, phase, indices, onDone) {
  let k = 0;
  const step = () => {
    if (k >= indices.length) { onDone(); render(); return; }
    const qi = indices[k++];
    const agg = phase === 'baseline' ? job._baseHits[qi] : job._verifHits[job.verification_subset.indexOf(qi)];
    enginesOf(job).forEach(e => job._runs.push(makeRun(job, phase, qi, e, engineHit(job, qi, e, agg), Date.now())));
    render();
    setTimeout(step, 750);
  };
  setTimeout(step, 600);
}
function postDone(key) {
  const parts = key.split(':'), name = parts[0], id = Number(parts[1]), job = getJob(id);
  delete state.busy[key];
  if (name === 'check-deliv') {
    const st = state.deliv[id], t = st.text.trim();
    // cermin lib/structural.ts checkStructural()
    if (t.length < MIN_DELIVERABLE) st.check = { pass: false, msg: 'Konten terlalu pendek (minimal ' + MIN_DELIVERABLE + ' karakter, dikirim ' + t.length + ').' };
    else if (!textHitsBrand(t, job.brand)) st.check = { pass: false, msg: 'Konten harus menyebut nama brand "' + job.brand + '" secara eksplisit.' };
    else st.check = { pass: true, hash: fakeHash('deliv' + t) };
    return;
  }
  if (name === 'verify') {
    const n = job.queries.length, r = rng('seed' + id + job.job_state);
    const idx = job.queries.map((_, i) => i).sort(() => r() - .5).slice(0, subsetSize(n)).sort((x, y) => x - y);
    job.job_state = 'running_verify'; job.verification_seed = fakeHash('seed' + id + Date.now()); job.verification_subset = idx;
    job._verifHits = idx.map((qi, k) => (job._baseHits[qi] || k % 4 !== 2) ? 1 : 0);
    state.radarPhase[id] = 'verification';
    simulateRuns(job, 'verification', idx, () => {
      const now = Date.now();
      job.verification_score = job._verifHits.reduce((x, y) => x + y, 0); job.verification_of = idx.length;
      job.verification_decision = decide(job.verification_score, job.verification_of, job.target_count, n);
      job.verdict_hash = fakeHash('verdict' + id + now); job._steps.verified = { ts: now };
      if (job.verification_decision === 'dispute') { job.status = 'Disputed'; job.job_state = 'idle'; pushAct(mkAct(job, 'dispute_raised', null, ORACLE, CONTRACT, 'Skor di zona abu', now)); toast('info', 'Skor ' + job.verification_score + '/' + job.verification_of + ' di zona abu — diserahkan ke arbiter.'); }
      else { settle(job, job.verification_decision === 'release', 'oracle', now + 2000); toast('ok', job.verification_decision === 'release' ? 'Target tercapai — dana cair otomatis ke freelancer.' : 'Target tidak tercapai — dana dikembalikan ke client.'); }
    });
    return;
  }
